<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-icon">🚗</div>Vehicle Admin</div><div class="nav-title">Main Menu</div><a class="nav-link" data-page="dashboard" href="dashboard.html">🏠 Dashboard</a><a class="nav-link" data-page="vehicles" href="vehicles.html">🚘 Vehicles</a><a class="nav-link" data-page="customers" href="customers.html">👥 Customers</a><a class="nav-link" data-page="bookings" href="bookings.html">📋 Bookings</a><a class="nav-link" data-page="payments" href="payments.html">💳 Payments</a><div class="nav-title">Analytics</div><a class="nav-link" data-page="reports" href="reports.html">📊 Reports</a></aside><main class="main"><header class="topbar"><div><button class="mobile-toggle" onclick="toggleSidebar()">☰</button><b>Vehicle Management System</b></div><div>Administrator</div></header><section class="content"><div class="page-heading"><div><h1>Customers</h1><p>Customer records.</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#m">+ Add Customer</button></div><div class="card table-card"><div class="card-header"><h3>Customer List</h3><input id="q" class="form-control search-box" placeholder="Search..." oninput="render()"></div><div class="table-responsive"><table class="table table-hover"><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main></div><div class="modal fade" id="m"><div class="modal-dialog"><div class="modal-content"><form id="form"><div class="modal-header"><h5>Add Customer</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"
