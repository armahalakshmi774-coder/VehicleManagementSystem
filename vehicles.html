<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vehicles</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-icon">🚗</div>Vehicle Admin</div><div class="nav-title">Main Menu</div><a class="nav-link" data-page="dashboard" href="dashboard.html">🏠 Dashboard</a><a class="nav-link" data-page="vehicles" href="vehicles.html">🚘 Vehicles</a><a class="nav-link" data-page="customers" href="customers.html">👥 Customers</a><a class="nav-link" data-page="bookings" href="bookings.html">📋 Bookings</a><a class="nav-link" data-page="payments" href="payments.html">💳 Payments</a><div class="nav-title">Analytics</div><a class="nav-link" data-page="reports" href="reports.html">📊 Reports</a></aside><main class="main"><header class="topbar"><div><button class="mobile-toggle" onclick="toggleSidebar()">☰</button><b>Vehicle Management System</b></div><div>Administrator <span class="badge bg-primary">A</span></div></header><section class="content"><div class="page-heading"><div><h1>Vehicles</h1><p>Manage your fleet.</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#vehicleModal">+ Add Vehicle</button></div><div class="card table-card"><div class="card-header"><h3>Vehicle List</h3><input id="q" class="form-control search-box" placeholder="Search..." oninput="render()"></div><div class="table-responsive"><table class="table table-hover"><thead><tr><th>ID</th><th>Number</th><th>Brand</th><th>Model</th><th>Type</th><th>Fuel</th><th>Price/Day</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main></div><div class="modal fade" id="vehicleModal"><div class="modal-dialog modal-lg"><div class="modal-content"><form id="form"><div class="modal-header"><h5 class="modal-title">Add Vehicle</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="row g-3"><div class="col-md-6"><label>Vehicle Number</label><input id="vehicleNumber" class="form-control" required></div><div class="col-md-6"><label>Brand</label><input id="brand" class="form-control"></div><div class="col-md-6"><label>Model</label><input id="model" class="form-control"></div><div class="col-md-6"><label>Type</label><select id="vehicleType" class="form-select"><option>SUV</option><option>Sedan</option><option>Hatchback</option><option>Bike</option></select></div><div class="col-md-6"><label>Fuel</label><select id="fuelType" class="form-select"><option>Petrol</option><option>Diesel</option><option>Electric</option><option>CNG</option></select></div><div class="col-md-6"><label>Year</label><input id="year" type="number" class="form-control" value="2024"></div><div class="col-md-6"><label>Price Per Day</label><input id="price" type="number" class="form-control" value="2500"></div></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Save</button></div></form></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/common.js"></script><script src="js/vehicles.js"></script></body></html>
